<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Taskboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --dur-instant:100ms; --dur-fast:140ms; --dur-base:180ms; --dur-slow:220ms;
    --ease-out:cubic-bezier(.16,1,.3,1); --ease-in-out:cubic-bezier(.4,0,.2,1); --ease-standard:cubic-bezier(.2,0,0,1);
  }
  html[data-theme="dark"]{
    --bg-page:#131417; --bg-sidebar:#0e0f11; --bg-panel:#232427; --bg-panel-alt:#2b2c30;
    --bg-input:#2b2c30; --border:#34353a; --text:#e8eaed; --text-secondary:#9aa0a6; --text-tertiary:#6b6f76;
    --accent:#669df6; --accent-dark:#8ab4f8; --accent-tint:rgba(102,157,246,.16);
    --danger:#f28b82; --danger-tint:rgba(242,139,130,.14);
    --status-progress:#f9ab00; --status-progress-tint:rgba(249,171,0,.16);
    --success:#81c995; --success-tint:rgba(129,201,149,.18);
    --shadow-1:0 1px 2px rgba(0,0,0,.5), 0 1px 3px rgba(0,0,0,.35);
    --shadow-2:0 2px 6px rgba(0,0,0,.55), 0 6px 16px rgba(0,0,0,.4);
    --shadow-lift:0 4px 10px rgba(0,0,0,.4), 0 1px 3px rgba(0,0,0,.4);
    --shadow-drag:0 12px 28px rgba(0,0,0,.5), 0 3px 8px rgba(0,0,0,.4);
    --overlay-bg:rgba(0,0,0,.6);
  }
  html[data-theme="light"]{
    --bg-page:#f1f3f4; --bg-sidebar:#ffffff; --bg-panel:#ffffff; --bg-panel-alt:#f1f3f4;
    --bg-input:#ffffff; --border:#dadce0; --text:#202124; --text-secondary:#5f6368; --text-tertiary:#80868b;
    --accent:#1a73e8; --accent-dark:#1765cc; --accent-tint:#e8f0fe;
    --danger:#d93025; --danger-tint:#fce8e6;
    --status-progress:#e8710a; --status-progress-tint:#fef0e2;
    --success:#1e8e3e; --success-tint:#e6f4ea;
    --shadow-1:0 1px 2px 0 rgba(60,64,67,.3), 0 1px 3px 1px rgba(60,64,67,.15);
    --shadow-2:0 1px 3px 0 rgba(60,64,67,.3), 0 4px 8px 3px rgba(60,64,67,.15);
    --shadow-lift:0 2px 6px rgba(60,64,67,.2), 0 4px 12px rgba(60,64,67,.15);
    --shadow-drag:0 8px 22px rgba(60,64,67,.28), 0 3px 8px rgba(60,64,67,.2);
    --overlay-bg:rgba(32,33,36,.5);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:var(--bg-page); color:var(--text); font-family:'Google Sans','Roboto',Arial,sans-serif;
    -webkit-font-smoothing:antialiased; overflow:hidden;
  }
  button,input,textarea{font-family:inherit; color:inherit;}
  button{
    background:none; border:none; margin:0; padding:0; cursor:pointer; text-align:inherit;
    -webkit-appearance:none; appearance:none; transition:transform var(--dur-fast) var(--ease-out), background var(--dur-fast) var(--ease-out), color var(--dur-fast) var(--ease-out), border-color var(--dur-fast) var(--ease-out), opacity var(--dur-fast) var(--ease-out), box-shadow var(--dur-fast) var(--ease-out);
  }
  button:active:not(:disabled){transform:scale(.96);}
  button:disabled{opacity:.4; cursor:default;}
  :focus-visible{outline:2px solid var(--accent); outline-offset:2px; transition:outline-offset var(--dur-instant) var(--ease-out);}
  @media (prefers-reduced-motion: reduce){ *{animation:none !important; transition:none !important;} }

  @keyframes popIn{ from{opacity:0; transform:scale(.94) translateY(-2px);} to{opacity:1; transform:scale(1) translateY(0);} }
  @keyframes fadeInUp{ from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:translateY(0);} }
  @keyframes fadeIn{ from{opacity:0;} to{opacity:1;} }
  @keyframes statusPulse{ 0%{transform:scale(1);} 40%{transform:scale(1.22);} 100%{transform:scale(1);} }
  @keyframes celebrateRing{ 0%{box-shadow:0 0 0 0 var(--success-tint);} 100%{box-shadow:0 0 0 10px rgba(0,0,0,0);} }
  @keyframes toastIn{ from{opacity:0; transform:translateY(10px) scale(.97);} to{opacity:1; transform:translateY(0) scale(1);} }
  @keyframes spin{ to{transform:rotate(360deg);} }


  .app-shell{display:flex; height:100vh; width:100vw;}

  /* ---------- Sidebar ---------- */
  .sidebar{
    width:280px; flex-shrink:0; background:var(--bg-sidebar); border-right:1px solid var(--border);
    display:flex; flex-direction:column; overflow:hidden; transition:width var(--dur-slow) var(--ease-standard);
  }
  .sidebar.collapsed{width:0; border-right:none;}
  .sidebar-inner{width:280px; display:flex; flex-direction:column; height:100%; opacity:1; transition:opacity var(--dur-fast) var(--ease-out);}
  .sidebar.collapsed .sidebar-inner{opacity:0;}
  .sidebar-header{display:flex; align-items:center; gap:10px; padding:16px 16px 10px;}
  .logo-mark{
    width:32px; height:32px; border-radius:9px; flex-shrink:0;
    background:var(--accent);
    display:flex; align-items:center; justify-content:center;
  }
  .logo-mark svg{width:16px; height:16px; stroke:#fff; stroke-width:2.5; fill:none; stroke-linecap:round; stroke-linejoin:round;}
  .sidebar-title{font-size:18px; font-weight:500;}
  .create-wrap{position:relative; margin:6px 16px 14px;}
  .create-btn{
    background:var(--bg-panel-alt); border:1px solid var(--border); color:var(--text);
    border-radius:20px; padding:10px 16px; font-size:14px; font-weight:500; cursor:pointer;
    display:flex; align-items:center; gap:8px; width:100%;
  }
  .create-btn:hover{background:var(--bg-panel); border-color:var(--accent);}
  .create-dropdown{
    position:absolute; top:calc(100% + 6px); left:0; right:0; background:var(--bg-panel);
    border:1px solid var(--border); border-radius:10px; box-shadow:var(--shadow-2); z-index:60; padding:6px; text-align:left;
    transform-origin:top center; animation:popIn var(--dur-fast) var(--ease-out);
  }
  .create-dropdown .menu-item{padding:10px 12px;}

  .nav-item{
    display:flex; align-items:center; gap:12px; padding:9px 16px; margin:0 8px; border-radius:8px;
    cursor:pointer; font-size:14px; color:var(--text); border:none; background:transparent; width:calc(100% - 16px);
    text-align:left; font:inherit; position:relative;
  }
  .nav-item:hover{background:var(--bg-panel-alt);}
  .nav-item.active{background:var(--accent-tint); color:var(--accent);}
  .nav-item svg{flex-shrink:0;}
  .nav-item .nav-label{flex:1;}
  .nav-item .nav-count{font-size:12px; color:var(--text-secondary); transition:color var(--dur-fast) var(--ease-out);}
  .nav-item.active .nav-count{color:var(--accent);}
  .nav-list{padding:2px 0 10px;}

  .section-pager{display:flex; flex-direction:column; flex:1; min-height:0;}
  .pager-controls{display:flex; align-items:center; gap:2px; padding:4px 8px 6px;}
  .pager-arrow{
    width:28px; height:28px; border-radius:50%; border:none; background:transparent; color:var(--text-secondary);
    display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0;
    transition:opacity var(--dur-fast) var(--ease-out), background var(--dur-fast) var(--ease-out), color var(--dur-fast) var(--ease-out);
  }
  .pager-arrow:hover:not(:disabled){background:var(--bg-panel-alt); color:var(--text);}
  .pager-arrow:disabled{opacity:.22; cursor:default;}
  .pager-title-wrap{position:relative; flex:1; min-width:0; display:flex; justify-content:center;}
  .pager-title-btn{
    display:flex; align-items:center; gap:5px; max-width:100%; border:none; background:transparent; cursor:pointer;
    padding:6px 8px; border-radius:8px; color:var(--text);
  }
  .pager-title-btn:hover{background:var(--bg-panel-alt);}
  .pager-title-btn.open{background:var(--bg-panel-alt);}
  .pager-title-text{
    font-size:12px; font-weight:600; color:var(--text-secondary); text-transform:uppercase; letter-spacing:.5px;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .pager-title-chevron{color:var(--text-tertiary); display:flex; flex-shrink:0; transition:transform var(--dur-fast) var(--ease-out);}
  .pager-title-btn.open .pager-title-chevron{transform:rotate(180deg);}
  .section-title-input{
    font:inherit; font-weight:600; font-size:12px; text-transform:none; border:1px solid var(--accent);
    border-radius:5px; padding:5px 7px; width:100%; outline:none; background:var(--bg-input); text-align:center;
  }
  .current-section-menu-btn{flex-shrink:0;}

  .all-sections-dropdown{
    position:absolute; top:calc(100% + 4px); left:0; right:0; background:var(--bg-panel);
    border:1px solid var(--border); border-radius:10px; box-shadow:var(--shadow-2); z-index:60; padding:6px;
    max-height:280px; overflow-y:auto; text-align:left;
  }
  .section-menu-item-row{display:flex; align-items:center; gap:8px; padding:8px 8px; border-radius:6px; cursor:pointer; border:none; background:none; font-family:inherit; width:100%; text-align:left;}
  .section-menu-item-row:hover{background:var(--bg-panel-alt);}
  .section-menu-item-row.active{background:var(--accent-tint); color:var(--accent);}
  .section-menu-item-row.row-dragging{opacity:.4;}
  .section-menu-item-row .sec-drag-handle{color:var(--text-tertiary); cursor:grab; display:flex; flex-shrink:0;}
  .section-menu-item-row .sec-item-name{flex:1; font-size:13.5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .section-menu-item-row .sec-item-count{font-size:11.5px; color:var(--text-secondary); flex-shrink:0;}
  .section-menu-item-row.active .sec-item-count{color:var(--accent);}
  .menu-divider{height:1px; background:var(--border); margin:6px 2px;}

  .pager-viewport{flex:1; min-height:0; overflow:hidden; -webkit-overflow-scrolling:touch;}
  .section-pager-body{
    height:100%; overflow-y:auto; padding:2px 8px 8px; overscroll-behavior:contain; -webkit-overflow-scrolling:touch;
    transition:transform var(--dur-base) var(--ease-out), opacity var(--dur-base) var(--ease-out);
  }
  .section-pager-body.pager-out-left{transform:translateX(-16px); opacity:0;}
  .section-pager-body.pager-out-right{transform:translateX(16px); opacity:0;}
  .section-pager-body.pager-in-from-right{transition:none !important; transform:translateX(16px); opacity:0;}
  .section-pager-body.pager-in-from-left{transition:none !important; transform:translateX(-16px); opacity:0;}
  .section-empty-hint{color:var(--text-tertiary); font-size:12.5px; text-align:center; padding:18px 12px;}
  .empty-state{
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px;
    text-align:center; padding:30px 18px; animation:fadeIn var(--dur-base) var(--ease-out);
  }
  .empty-state svg{color:var(--text-tertiary); opacity:.65;}
  .empty-state .empty-title{font-size:13px; font-weight:600; color:var(--text-secondary);}
  .empty-state .empty-desc{font-size:12px; color:var(--text-tertiary); max-width:230px; line-height:1.5;}
  .icon-btn{
    width:26px; height:26px; border-radius:50%; border:none; background:transparent; color:var(--text-secondary);
    display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0;
  }
  .icon-btn:hover{background:var(--bg-panel);}
  .section-menu-wrap, .list-menu-wrap{position:relative;}
  .menu-dropdown{
    position:absolute; right:0; top:28px; background:var(--bg-panel); border:1px solid var(--border);
    border-radius:8px; box-shadow:var(--shadow-2); min-width:190px; z-index:60; padding:6px;
  }
  .menu-item{padding:9px 12px; font-size:13.5px; cursor:pointer; border-radius:6px; color:var(--text); border:none; background:none; font-family:inherit; display:block; width:100%; text-align:left;}
  .menu-item:hover{background:var(--bg-panel-alt);}
  .menu-item.danger{color:var(--danger);}

  .list-row{
    display:flex; align-items:center; gap:10px; padding:8px 8px 8px 26px; cursor:pointer; border-radius:8px;
    margin:0 8px 1px; position:relative;
  }
  .list-row:hover{background:var(--bg-panel-alt);}
  .list-row.selected{background:var(--accent-tint);}
  .list-row.row-dragging{opacity:.35;}
  .list-row:hover .list-menu-btn, .list-row:hover .list-drag-handle{opacity:1;}
  .list-drag-handle{color:var(--text-tertiary); cursor:grab; opacity:0; display:flex; flex-shrink:0;}
  .list-checkbox{
    width:16px; height:16px; min-width:16px; border-radius:50%; border:2px solid var(--text-tertiary);
    display:flex; align-items:center; justify-content:center; flex-shrink:0; background:transparent; padding:0;
  }
  .list-checkbox.checked{background:var(--accent); border-color:var(--accent);}
  .list-checkbox svg{width:9px; height:9px; stroke:#fff; stroke-width:3.6; fill:none; opacity:0;}
  .list-checkbox.checked svg{opacity:1;}
  .list-name{
    flex:1; font-size:13.6px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; cursor:text;
    border:none; background:none; font-family:inherit; text-align:left; padding:0; color:var(--text); min-width:0;
  }
  .list-name-input{
    flex:1; font:inherit; font-size:13.6px; border:1px solid var(--accent); border-radius:5px; padding:2px 5px;
    outline:none; background:var(--bg-input); min-width:0;
  }
  .list-count{font-size:11.5px; color:var(--text-secondary); flex-shrink:0;}
  .list-row.selected .list-count{color:var(--accent);}
  .add-list-row{padding:8px 8px 10px 26px; margin:0 8px;}
  .add-list-input{
    width:100%; border:1px solid var(--accent); border-radius:7px; padding:7px 10px; font-size:13.5px;
    outline:none; background:var(--bg-input);
  }
  .add-list-btn-row{
    display:flex; align-items:center; gap:8px; padding:8px 8px 10px 26px; margin:0 8px; color:var(--text-secondary);
    font-size:13px; cursor:pointer; border-radius:8px; border:none; background:none; font-family:inherit; width:calc(100% - 16px); text-align:left;
  }
  .add-list-btn-row:hover{background:var(--bg-panel-alt); color:var(--text);}

  .add-section-row{
    display:flex; align-items:center; gap:8px; padding:10px 16px; margin:6px 8px 0; color:var(--text-secondary);
    font-size:13.5px; cursor:pointer; border-radius:8px; border:none; background:none; font-family:inherit; width:calc(100% - 16px); text-align:left;
  }
  .add-section-row:hover{background:var(--bg-panel-alt); color:var(--text);}
  .add-section-input-wrap{padding:6px 16px; margin:6px 0 0;}
  .add-section-input{
    width:100%; border:1px solid var(--accent); border-radius:8px; padding:9px 12px; font-size:13.5px;
    outline:none; background:var(--bg-input);
  }

  .sidebar-footer{border-top:1px solid var(--border); padding:6px;}
  .settings-btn{
    display:flex; align-items:center; gap:12px; padding:9px 10px; border-radius:8px; cursor:pointer;
    font-size:13.6px; color:var(--text); border:none; background:transparent; width:100%; text-align:left;
  }
  .settings-btn:hover{background:var(--bg-panel-alt);}

  .sidebar-backdrop{display:none;}

  /* ---------- Main area ---------- */
  .main-wrap{flex:1; min-width:0; display:flex; flex-direction:column; height:100vh;}
  .topbar{
    height:60px; flex-shrink:0; display:flex; align-items:center; gap:14px; padding:0 18px;
    border-bottom:1px solid var(--border);
  }
  .search-wrap{position:relative; flex:1; max-width:440px;}
  .search-wrap svg{position:absolute; left:13px; top:50%; transform:translateY(-50%); color:var(--text-secondary);}
  .search-input{
    width:100%; background:var(--bg-panel-alt); border:1px solid transparent; border-radius:22px;
    padding:9px 14px 9px 40px; font-size:14px; outline:none; color:var(--text);
  }
  .search-input:focus{border-color:var(--accent); background:var(--bg-panel);}

  .board{flex:1; overflow-x:auto; overflow-y:hidden; display:flex; gap:16px; padding:20px; align-items:flex-start;}
  .board > .empty-state{margin:auto; max-width:320px;}

  .column{
    background:var(--bg-panel); border:1px solid var(--border); border-radius:12px; width:300px; flex-shrink:0;
    display:flex; flex-direction:column; max-height:calc(100vh - 100px); box-shadow:var(--shadow-1);
  }
  .column-header{display:flex; align-items:center; gap:8px; padding:14px 8px 8px 16px;}
  .column-title{font-weight:500; font-size:15px; flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .count-badge{background:var(--bg-panel-alt); color:var(--text-secondary); font-size:11.5px; padding:2px 8px; border-radius:10px; flex-shrink:0;}

  .add-task-btn{
    color:var(--text-secondary); font-size:13.5px; padding:8px 16px 10px; cursor:pointer; display:flex;
    align-items:center; gap:6px; border:none; background:transparent; width:100%; text-align:left;
  }
  .add-task-btn:hover{color:var(--accent);}
  .add-task-form{margin:0 12px 10px; background:var(--bg-panel); border:1px solid var(--accent); border-radius:8px; padding:8px; box-shadow:var(--shadow-1);}
  .add-task-form textarea{width:100%; border:none; outline:none; resize:none; font-family:inherit; font-size:13.8px; background:transparent; display:block;}
  .add-task-form textarea[data-new-task-input]{min-height:20px;}
  .add-task-form .add-task-notes{font-size:12.5px; color:var(--text-secondary); margin-top:4px; min-height:18px;}
  .form-actions{display:flex; gap:8px; margin-top:6px;}
  .btn-small-primary{background:var(--accent); color:#fff; border:none; border-radius:6px; padding:7px 14px; font-size:13px; font-weight:500; cursor:pointer;}
  html[data-theme="dark"] .btn-small-primary{color:#131417;}
  .btn-small-primary:hover{opacity:.9;}
  .btn-text{background:none; border:none; color:var(--text-secondary); font-size:13px; padding:7px 10px; border-radius:6px; cursor:pointer; font-weight:500;}
  .btn-text:hover{background:var(--bg-panel-alt);}

  .task-list{flex:1; overflow-y:auto; padding:2px 8px 6px; display:flex; flex-direction:column; gap:3px;}
  .task-list.list-drag-over{background:var(--accent-tint); border-radius:8px; transition:background var(--dur-fast) var(--ease-out);}
  .drop-placeholder{
    height:48px; border-radius:8px; border:2px dashed var(--accent); background:var(--accent-tint);
    animation:placeholderIn var(--dur-fast) var(--ease-out); flex-shrink:0;
  }
  @keyframes placeholderIn{ from{opacity:0; transform:scaleY(.6);} to{opacity:1; transform:scaleY(1);} }
  .empty-hint{color:var(--text-tertiary); font-size:12.5px; text-align:center; padding:16px 8px;}

  .task-card{
    border-radius:8px; padding:9px 10px 9px 15px; cursor:grab; position:relative;
    user-select:none; -webkit-user-select:none;
    transition:background var(--dur-fast) var(--ease-out), transform var(--dur-fast) var(--ease-out), box-shadow var(--dur-fast) var(--ease-out), opacity var(--dur-fast) var(--ease-out);
  }
  .task-drag-handle{
    position:absolute; left:1px; top:10px; opacity:0; color:var(--text-tertiary); cursor:grab; display:flex;
    padding:2px; border-radius:4px; transition:opacity var(--dur-fast) var(--ease-out), background var(--dur-fast) var(--ease-out), color var(--dur-fast) var(--ease-out);
  }
  .task-card:hover .task-drag-handle{opacity:1;}
  .task-drag-handle:hover{background:var(--bg-panel); color:var(--text);}
  .task-card:hover{background:var(--bg-panel-alt); transform:translateY(-1px); box-shadow:var(--shadow-1);}
  .task-card:active{cursor:grabbing;}
  .task-card.card-dragging{opacity:.3; transform:scale(.98);}
  .task-card.completed .task-title{text-decoration:line-through; color:var(--text-secondary);}
  .task-card.completing{animation:completedFlash var(--dur-slow) var(--ease-out);}
  @keyframes completedFlash{ 0%{background:var(--success-tint); box-shadow:0 0 0 1px var(--success) inset;} 100%{background:transparent; box-shadow:none;} }
  .task-card.entering{animation:fadeInUp var(--dur-base) var(--ease-out);}
  .task-card.leaving{animation:fadeOutShrink var(--dur-fast) var(--ease-out) forwards;}
  @keyframes fadeOutShrink{ from{opacity:1; transform:scale(1); max-height:200px; margin-bottom:3px;} to{opacity:0; transform:scale(.9); max-height:0; margin-bottom:0; padding-top:0; padding-bottom:0;} }
  .color-bar{position:absolute; left:0; top:8px; bottom:8px; width:3px; border-radius:3px;}
  .task-row{display:flex; gap:9px; align-items:flex-start;}
  .status-dot{
    width:17px; height:17px; min-width:17px; border-radius:50%; border:2px solid var(--text-tertiary); background:transparent;
    margin-top:2px; cursor:pointer; display:flex; align-items:center; justify-content:center; padding:0; flex-shrink:0;
    transition:background var(--dur-fast) var(--ease-out), border-color var(--dur-fast) var(--ease-out), transform var(--dur-fast) var(--ease-out);
  }
  .status-dot:hover{transform:scale(1.12);}
  .status-dot.pulse{animation:statusPulse var(--dur-base) var(--ease-out);}
  .status-dot .status-icon{width:9px; height:9px; opacity:0; transition:opacity var(--dur-fast) var(--ease-out);}
  .status-dot .status-icon-check{stroke:#fff; stroke-width:3.6; fill:none;}
  .status-dot .status-icon-progress{fill:var(--status-progress); stroke:none;}

<script>
(function(){
  "use strict";

  /* ---------------- Icons ---------------- */

  function escapeHtml(str){

  /* ---------------- Lightweight Markdown renderer (no dependencies, XSS-safe) ---------------- */
  function mdInline(text){
    var codeStore = [];
    text = text.replace(/`([^`]+)`/g, function(m, code){
      codeStore.push(code);
      return '\u0000C' + (codeStore.length - 1) + '\u0000';
    });
    text = text.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    text = text.replace(/__([^_]+)__/g, '<strong>$1</strong>');
    text = text.replace(/\*([^*\n]+)\*/g, '<em>$1</em>');
    text = text.replace(/(^|[^\w])_([^_\n]+)_(?!\w)/g, '$1<em>$2</em>');
    text = text.replace(/~~([^~]+)~~/g, '<del>$1</del>');
    text = text.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, function(m, label, url){
      var safeUrl = /^(https?:|mailto:)/i.test(url) ? url : '#';
      return '<a href="' + safeUrl + '" target="_blank" rel="noopener noreferrer">' + label + '</a>';
    });
    text = text.replace(/\u0000C(\d+)\u0000/g, function(m, idx){ return '<code>' + codeStore[idx] + '</code>'; });
    return text;
  }

  function renderMarkdown(raw){
    if(!raw) return '';
    var lines = escapeHtml(raw).split('\n');
    var html = '';
    var listStack = [];
    var paragraphBuffer = [];
    var inCodeBlock = false;
    var codeBuffer = [];

    function closeLists(){ while(listStack.length){ html += '</' + listStack.pop() + '>'; } }
    function flushParagraph(){
      if(paragraphBuffer.length){ html += '<p>' + paragraphBuffer.join('<br>') + '</p>'; paragraphBuffer = []; }
    }

    for(var i = 0; i < lines.length; i++){
      var line = lines[i];
      var trimmed = line.trim();

      if(/^```/.test(trimmed)){
        if(!inCodeBlock){ flushParagraph(); closeLists(); inCodeBlock = true; codeBuffer = []; }
        else { html += '<pre><code>' + codeBuffer.join('\n') + '</code></pre>'; inCodeBlock = false; }
        continue;
      }
      if(inCodeBlock){ codeBuffer.push(line); continue; }

      if(trimmed === ''){ flushParagraph(); closeLists(); continue; }

      var hMatch = /^(#{1,6})\s+(.*)$/.exec(trimmed);
      if(hMatch){
        flushParagraph(); closeLists();
        var level = hMatch[1].length;
        html += '<h' + level + '>' + mdInline(hMatch[2]) + '</h' + level + '>';
        continue;
      }

      if(/^(-{3,}|\*{3,}|_{3,})$/.test(trimmed)){
        flushParagraph(); closeLists();
        html += '<hr>';
        continue;
      }

      var bqMatch = /^&gt;\s?(.*)$/.exec(trimmed);
      if(bqMatch){
        flushParagraph(); closeLists();
        html += '<blockquote>' + mdInline(bqMatch[1]) + '</blockquote>';
        continue;
      }

      var cbMatch = /^[-*+]\s+\[([ xX])\]\s+(.*)$/.exec(trimmed);
      if(cbMatch){
        flushParagraph();
        if(listStack[listStack.length - 1] !== 'ul'){ closeLists(); html += '<ul class="md-checklist">'; listStack.push('ul'); }
        var checked = cbMatch[1].toLowerCase() === 'x';
        html += '<li class="md-check-item' + (checked ? ' checked' : '') + '"><span class="md-checkbox"></span><span>' + mdInline(cbMatch[2]) + '</span></li>';
        continue;
      }

      var ulMatch = /^[-*+]\s+(.*)$/.exec(trimmed);
      if(ulMatch){
        flushParagraph();
        if(listStack[listStack.length - 1] !== 'ul'){ closeLists(); html += '<ul>'; listStack.push('ul'); }
        html += '<li>' + mdInline(ulMatch[1]) + '</li>';
        continue;
      }

      var olMatch = /^\d+\.\s+(.*)$/.exec(trimmed);
      if(olMatch){
        flushParagraph();
        if(listStack[listStack.length - 1] !== 'ol'){ closeLists(); html += '<ol>'; listStack.push('ol'); }
        html += '<li>' + mdInline(olMatch[1]) + '</li>';
        continue;
      }

      closeLists();
      paragraphBuffer.push(mdInline(trimmed));
    }

    flushParagraph();
    closeLists();
    if(inCodeBlock && codeBuffer.length){ html += '<pre><code>' + codeBuffer.join('\n') + '</code></pre>'; }

    return html;
  }

  /* Almacenamiento: usa window.storage dentro de Claude.ai; si el archivo se
     abre por fuera (descargado, doble clic, otro hosting), esa API no existe,
     así que se cae a localStorage del navegador y, si tampoco está disponible,
     a memoria (funciona igual, pero no sobrevive a un refresh). */
  var storageBackend = (function(){
    if(window.storage && typeof window.storage.get === 'function' && typeof window.storage.set === 'function'){
      return {
        get: function(key){ return window.storage.get(key, false); },
        set: function(key, value){ return window.storage.set(key, value, false); }
      };
    }
    var hasLocalStorage = false;
    try{
      var testKey = '__taskboard_test__';
      window.localStorage.setItem(testKey, '1');
      window.localStorage.removeItem(testKey);
      hasLocalStorage = true;
    }catch(e){ hasLocalStorage = false; }

    if(hasLocalStorage){
      return {
        get: function(key){
          return new Promise(function(resolve, reject){
            var v = window.localStorage.getItem(key);
            if(v === null){ reject(new Error('not found')); } else { resolve({key:key, value:v}); }
          });
        },
        set: function(key, value){
          return new Promise(function(resolve){ window.localStorage.setItem(key, value); resolve({key:key, value:value}); });
        }
      };
    }

    var mem = {};
    return {
      get: function(key){
        return new Promise(function(resolve, reject){
          if(!(key in mem)){ reject(new Error('not found')); } else { resolve({key:key, value:mem[key]}); }
        });
      },
      set: function(key, value){
        return new Promise(function(resolve){ mem[key] = value; resolve({key:key, value:value}); });
      }
    };
  })();

  function loadState(){
    return storageBackend.get(STORAGE_KEY).then(function(res){
      if(res && res.value){
        var parsed = JSON.parse(res.value);
        if(parsed && Array.isArray(parsed.sections) && Array.isArray(parsed.lists) && Array.isArray(parsed.tasks)){
          parsed.view = parsed.view || { mode:'lists', selectedListIds:[], sidebarCollapsed:false, currentSectionId:null };
          parsed.theme = parsed.theme || 'dark';
          migrateTasksStatus(parsed.tasks);
          state = parsed;
          return;

      state = seedState();
      persist();
    }).catch(function(){

  /* ---------------- Generic ordered insert / drag helpers ---------------- */
  function insertInto(array, item, keyField, keyValue, afterId){
    item[keyField] = keyValue;
    if(afterId){
      var idx = array.findIndex(function(x){ return x.id === afterId; });
      if(idx > -1){ array.splice(idx, 0, item); return; }
    }
    var lastIdx = -1;
    array.forEach(function(x,i){ if(x[keyField] === keyValue) lastIdx = i; });
    array.splice(lastIdx+1, 0, item);
  }
  function getDragAfterElementY(container, y, itemSelector, excludeEl){
    var els = [].slice.call(container.querySelectorAll(itemSelector));
    var closest = {offset:-Infinity, element:null};
    els.forEach(function(child){
      if(child === excludeEl) return;
      var box = child.getBoundingClientRect();
      var offset = y - box.top - box.height/2;
      if(offset < 0 && offset > closest.offset){ closest = {offset:offset, element:child}; }
    });
    return closest.element;
  }

      if(key in positions) el.scrollTop = positions[key];

    if(pagerBody && 'sidebar' in positions) pagerBody.scrollTop = positions.sidebar;

    html += '<button class="pager-arrow" id="sec-prev-btn"' + (canPrev ? '' : ' disabled') + ' aria-label="Sección anterior">' + ICON.chevronLeft + '</button>';
    html += '<div class="pager-title-wrap">';
    if(ui.editingCurrentSectionTitle){
      html += '<input class="section-title-input" id="current-section-title-input" value="' + escapeHtml(sec.title) + '" maxlength="40">';
    }else{
      html += '<button class="pager-title-btn' + (ui.allSectionsMenuOpen ? ' open' : '') + '" id="pager-title-btn" title="Ver todas las secciones">';
      html += '<span class="pager-title-text">' + escapeHtml(sec.title) + '</span>';
      html += '<span class="pager-title-chevron">' + ICON.chevronDown + '</span>';
      html += '</button>';
      if(ui.allSectionsMenuOpen){ html += renderAllSectionsDropdown(); }
    }
    html += '</div>';
    html += '<button class="pager-arrow" id="sec-next-btn"' + (canNext ? '' : ' disabled') + ' aria-label="Sección siguiente">' + ICON.chevronRight + '</button>';
    html += '<div class="current-section-menu-btn section-menu-wrap">';
    html += '<button class="icon-btn" id="current-section-menu-toggle" title="Más opciones de esta sección">' + ICON.dots + '</button>';
    if(ui.currentSectionMenuOpen){
      html += '<div class="menu-dropdown">';
      html += '<button type="button" class="menu-item" id="current-section-rename-trigger">Cambiar nombre</button>';
      if(ui.confirmDeleteCurrentSection){
        html += '<button type="button" class="menu-item danger" id="current-section-confirm-delete">Eliminar y borrar sus listas</button>';
      }else{
        html += '<button type="button" class="menu-item danger" id="current-section-delete-trigger">Eliminar sección</button>';
      }
      html += '</div>';
    }
    html += '</div>';
    return html;
  }

  function renderSectionPager(){
    if(state.sections.length === 0){
      return '<div class="section-pager">' + renderEmptyState(ICON.emptyInbox, 'Sin secciones todavía', 'Creá una para empezar a organizar tus listas.') + '</div>';
    }
    var sec = currentSection();
    var idx = getSectionIndex(sec.id);
    var html = '<div class="section-pager">';
    html += '<div class="pager-controls" id="pager-controls">' + renderPagerControlsInner(sec, idx) + '</div>';
    html += '<div class="pager-viewport"><div class="section-pager-body" id="section-pager-body">' + renderSectionBodyInner(sec) + '</div></div>';
    html += '</div>';
    return html;
  }

  function renderSectionBodyInner(sec){
    if(!sec) return '';
    var lists = state.lists.filter(function(l){ return l.sectionId === sec.id; });
    var html = '';
    lists.forEach(function(list){
      var selected = state.view.mode === 'lists' && state.view.selectedListIds.indexOf(list.id) > -1;
      html += '<div class="list-row' + (selected ? ' selected' : '') + '" draggable="true" data-list-drag="' + list.id + '" data-list-id="' + list.id + '">';
      html += '<span class="list-drag-handle">' + ICON.grip + '</span>';
      html += '<button type="button" class="list-checkbox' + (selected ? ' checked' : '') + '" data-toggle-list="' + list.id + '" aria-label="Seleccionar lista">' + ICON.check + '</button>';
      if(ui.editingListTitleId === list.id){
        html += '<input class="list-name-input" data-rename-list="' + list.id + '" value="' + escapeHtml(list.title) + '" maxlength="40">';
      }else{
        html += '<button type="button" class="list-name" data-select-list="' + list.id + '">' + escapeHtml(list.title) + '</button>';
        html += '<span class="list-count">' + listActiveCount(list.id) + '</span>';
      }
      html += '<div class="list-menu-wrap">';
      html += '<button class="icon-btn list-menu-btn" data-toggle-list-menu="' + list.id + '" title="Más opciones">' + ICON.dots + '</button>';
      if(ui.openListMenuId === list.id){
        html += '<div class="menu-dropdown">';
        if(ui.movingListId === list.id){
          html += '<button type="button" class="menu-item" data-move-list-back="' + list.id + '">' + ICON.chevronLeft + ' Volver</button>';
          html += '<div class="menu-divider"></div>';
          var others = state.sections.filter(function(s){ return s.id !== sec.id; });
          if(others.length === 0){
            html += '<div class="menu-item" style="color:var(--text-tertiary); cursor:default;">No hay otra sección</div>';
          }else{
            others.forEach(function(other){
              html += '<button type="button" class="menu-item" data-move-list-to="' + list.id + '|' + other.id + '">' + escapeHtml(other.title) + '</button>';
            });
          }
        }else{
          html += '<button type="button" class="menu-item" data-rename-list-trigger="' + list.id + '">Cambiar nombre</button>';
          if(state.sections.length > 1){
            html += '<button type="button" class="menu-item" data-move-list-trigger="' + list.id + '">Mover a otra sección</button>';
          }
          if(ui.confirmDeleteListId === list.id){
            html += '<button type="button" class="menu-item danger" data-confirm-delete-list="' + list.id + '">Eliminar y borrar tareas</button>';
          }else{
            html += '<button type="button" class="menu-item danger" data-delete-list="' + list.id + '">Eliminar lista</button>';
          }
        }
        html += '</div>';
      }
      html += '</div>';
      html += '</div>';
    });

    var addControl;
    if(ui.addingListToSectionId === sec.id){
      addControl = '<div class="add-list-row"><input class="add-list-input" id="new-list-input" placeholder="Nombre de la lista" maxlength="40"></div>';
    }else{
      addControl = '<button type="button" class="add-list-btn-row" data-add-list-to="' + sec.id + '">' + ICON.plus + ' Añadir lista</button>';
    }

    if(lists.length === 0){
      html += '<div class="section-empty-hint">Todavía no hay listas acá.</div>';
    }
    html += addControl;
    return html;
  }

  function renderAllSectionsDropdown(){
    var html = '<div class="all-sections-dropdown" id="all-sections-dropdown">';
    state.sections.forEach(function(s){
      var active = s.id === state.view.currentSectionId;
      html += '<button type="button" class="section-menu-item-row' + (active ? ' active' : '') + '" draggable="true" data-sec-drag="' + s.id + '" data-sec-id="' + s.id + '" data-jump-section="' + s.id + '">';
      html += '<span class="sec-drag-handle">' + ICON.grip + '</span>';
      html += '<span class="sec-item-name">' + escapeHtml(s.title) + '</span>';
      html += '<span class="sec-item-count">' + listCountForSection(s.id) + '</span>';
      html += '</button>';
    });
    html += '<div class="menu-divider"></div>';
    html += '<button type="button" class="menu-item" id="dropdown-add-section-opt">' + ICON.plus + ' Nueva sección</button>';
    html += '</div>';
    return html;
  }

  function updatePagerControlsInPlace(){
    var el = document.getElementById('pager-controls');
    var sec = currentSection();
    if(!el || !sec) return;
    el.innerHTML = renderPagerControlsInner(sec, getSectionIndex(sec.id));
  }

  function goToSection(targetId, forcedDirection){
    if(!targetId || targetId === state.view.currentSectionId || pagerAnimating) return;
    var curIdx = getSectionIndex(state.view.currentSectionId);
    var tgtIdx = getSectionIndex(targetId);
    if(tgtIdx === -1) return;
    var direction = forcedDirection || (tgtIdx > curIdx ? 'next' : 'prev');
    var body = document.getElementById('section-pager-body');
    if(!body){
      state.view.currentSectionId = targetId; persist(); render(); return;
    }
    pagerAnimating = true;
    ui.allSectionsMenuOpen = false;
    ui.currentSectionMenuOpen = false;
    ui.confirmDeleteCurrentSection = false;
    ui.editingCurrentSectionTitle = false;
    ui.addingListToSectionId = null;
    ui.openListMenuId = null;
    ui.movingListId = null;
    body.classList.add(direction === 'next' ? 'pager-out-left' : 'pager-out-right');
    window.setTimeout(function(){
      state.view.currentSectionId = targetId;
      persist();
      updatePagerControlsInPlace();
      var sec = currentSection();
      body.innerHTML = renderSectionBodyInner(sec);
      wireSidebarInputs();
      body.className = 'section-pager-body ' + (direction === 'next' ? 'pager-in-from-right' : 'pager-in-from-left');
      void body.offsetWidth;
      requestAnimationFrame(function(){
        body.className = 'section-pager-body';
        window.setTimeout(function(){ pagerAnimating = false; }, DUR_BASE + 20);
      });
    }, DUR_BASE);
  }

  /* ================= BOARD ================= */
  function matchesSearch(task){
    var q = ui.searchQuery.trim().toLowerCase();
    if(!q) return true;
    if((task.title||'').toLowerCase().indexOf(q) > -1) return true;
    if((task.notes||'').toLowerCase().indexOf(q) > -1) return true;
    return (task.subtasks||[]).some(function(s){
      return (s.title||'').toLowerCase().indexOf(q) > -1 || (s.notes||'').toLowerCase().indexOf(q) > -1;
    });
  }

  function renderBoard(){
    var html = '';

    if(state.view.mode === 'all' || state.view.mode === 'starred'){
      var tasks = state.tasks.filter(function(t){
        if(t.status === 'completed') return false;
        if(state.view.mode === 'starred' && !t.starred) return false;
        return matchesSearch(t);
      });
      var title = state.view.mode === 'all' ? 'Todas las tareas' : 'Destacadas';
      html += '<div class="column">';
      html += '<div class="column-header"><span class="column-title">' + title + '</span><span class="count-badge">' + tasks.length + '</span></div>';
      html += '<div class="task-list">';
      tasks.forEach(function(t){ html += renderTaskCard(t, true); });
      if(tasks.length === 0){
        if(ui.searchQuery.trim()){
          html += '<div class="empty-hint">Sin resultados para "' + escapeHtml(ui.searchQuery.trim()) + '"</div>';
        } else if(state.view.mode === 'starred'){
          html += renderEmptyState(ICON.emptyDone, 'Sin destacadas', 'Marcá tareas con la estrella para verlas acá.');
        } else {
          html += renderEmptyState(ICON.emptyDone, '¡Estás al día!', 'No tenés tareas pendientes.');
        }
      }
      html += '</div></div>';
    } else {
      var ids = state.view.selectedListIds.filter(function(id){ return state.lists.some(function(l){ return l.id === id; }); });
      if(ids.length === 0){
        html += renderEmptyState(ICON.emptyInbox, 'Nada para mostrar', 'Elegí una o más listas en el menú de la izquierda para ver sus tareas acá.');
      } else {
        ids.forEach(function(listId){
          var list = state.lists.find(function(l){ return l.id === listId; });
          if(!list) return;
          html += renderListColumn(list);
        });
      }
    }

    boardEl.innerHTML = html;
  }

  function renderListColumn(list){
    var all = state.tasks.filter(function(t){ return t.listId === list.id && matchesSearch(t); });
    var active = all.filter(function(t){ return t.status !== 'completed'; });
    var done = all.filter(function(t){ return t.status === 'completed'; });
    var expanded = !!ui.expandedCompletedListIds[list.id];

    var html = '<div class="column" data-col-list="' + list.id + '">';
    html += '<div class="column-header"><span class="column-title">' + escapeHtml(list.title) + '</span><span class="count-badge">' + active.length + '</span>';
    html += '<button class="icon-btn col-remove-btn" data-remove-from-view="' + list.id + '" title="Quitar de la vista">' + ICON.x + '</button>';
    html += '</div>';

    if(ui.addingToListId === list.id){
      html += '<div class="add-task-form"><textarea data-new-task-input="' + list.id + '" placeholder="Título de la tarea" rows="1"></textarea>';
      html += '<textarea class="add-task-notes auto-resize" data-new-task-notes="' + list.id + '" placeholder="Notas (opcional)" rows="1"></textarea>';
      html += '<div class="form-actions"><button class="btn-small-primary" data-submit-task="' + list.id + '">Añadir tarea</button><button class="btn-text" data-cancel-task="' + list.id + '">Cancelar</button></div></div>';
    }else{
      html += '<button class="add-task-btn" data-add-task="' + list.id + '">' + ICON.plus + ' Añadir tarea</button>';
    }

    html += '<div class="task-list" data-list-tasks="' + list.id + '">';
    active.forEach(function(t){ html += renderTaskCard(t, false); });
    if(active.length === 0){
      if(ui.searchQuery.trim()){
        html += '<div class="empty-hint">Sin resultados</div>';
      } else if(done.length > 0){
        html += renderEmptyState(ICON.emptyDone, '¡Todo listo!', 'Completaste todas las tareas de esta lista.');
      } else {
        html += renderEmptyState(ICON.emptyInbox, 'Sin tareas', 'Agregá la primera con el botón de arriba.');
      }
    }
    html += '</div>';

    if(done.length > 0){
      html += '<button type="button" class="completed-toggle' + (expanded ? ' expanded' : '') + '" data-toggle-completed="' + list.id + '"><span>Completadas (' + done.length + ')</span>' + ICON.chevronDown + '</button>';
      if(expanded){
        html += '<div class="completed-body">';
        done.forEach(function(t){ html += renderTaskCard(t, false); });
        html += '</div>';
      }
    }

    html += '</div>';
    return html;
  }

  function renderTaskCard(t, showListBadge){
    var color = t.color && COLORS[t.color] ? COLORS[t.color] : null;
    var statusLabel = STATUS_LABELS[t.status] || 'Sin empezar';
    var html = '<div class="task-card' + (t.status === 'completed' ? ' completed' : '') + (ui.pendingDeleteTaskId === t.id ? ' pending-delete' : '') + '" draggable="true" data-task-id="' + t.id + '" data-open-task="' + t.id + '" tabindex="0">';
    html += '<span class="task-drag-handle" aria-hidden="true">' + ICON.grip + '</span>';
    if(color){ html += '<div class="color-bar" style="background:' + color + '"></div>'; }
    html += '<div class="task-row">';
    html += '<button class="status-dot status-' + t.status + '" data-cycle-status="' + t.id + '" aria-label="Estado: ' + statusLabel + '. Tocar para cambiar de estado.">';
    html += '<svg class="status-icon status-icon-check" viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></svg>';
    html += '<svg class="status-icon status-icon-progress" viewBox="0 0 24 24"><circle cx="12" cy="12" r="7"/></svg>';
    html += '</button>';
    html += '<div class="task-title-row"><span class="task-title" data-open-task="' + t.id + '">' + escapeHtml(t.title) + '</span>';
    if(t.starred){ html += '<button class="star-btn starred" data-toggle-star="' + t.id + '" aria-label="Quitar de destacadas">' + ICON.starFilled + '</button>'; }
    html += '</div></div>';
    if(t.notes){ html += '<div class="task-notes md-content" data-open-task="' + t.id + '">' + renderMarkdown(t.notes) + '</div>'; }

    var metaBits = '';
    if(t.status === 'in_progress'){ metaBits += '<span class="status-chip">En curso</span>'; }
    if(t.dueDate){
      var overdue = isOverdue(t.dueDate) && t.status !== 'completed';
      metaBits += '<span class="due-chip' + (overdue ? ' overdue' : '') + '">' + ICON.calendar + ' ' + formatDueDate(t.dueDate) + '</span>';
    }
    if(showListBadge){
      var l = state.lists.find(function(x){ return x.id === t.listId; });
      if(l){ metaBits += '<span class="list-badge">' + escapeHtml(l.title) + '</span>'; }
    }
    if(metaBits){ html += '<div class="task-meta" data-open-task="' + t.id + '">' + metaBits + '</div>'; }

    if(t.subtasks && t.subtasks.length){
      html += '<div class="subtasks">';
      t.subtasks.forEach(function(s){
        html += '<div class="subtask-row' + (s.completed ? ' completed' : '') + '">';
        html += '<button class="checkbox' + (s.completed ? ' checked' : '') + '" data-toggle-subtask="' + t.id + '|' + s.id + '" aria-label="Marcar subtarea como completada">' + ICON.check + '</button>';
        html += '<div style="flex:1;min-width:0;" data-open-task="' + t.id + '"><span class="subtask-title">' + escapeHtml(s.title) + '</span>';
        if(s.notes){ html += '<div class="subtask-notes md-content">' + renderMarkdown(s.notes) + '</div>'; }
        html += '</div></div>';
      });
      html += '</div>';
    }

    html += '</div>';
    return html;
  }

  /* ================= MUTATIONS: sections/lists ================= */
  function addSection(title){
    title = title.trim();
    if(!title) return;
    var sec = {id:uid('sec'), title:title};
    state.sections.push(sec);
    state.view.currentSectionId = sec.id;
    persist();
  }
  function renameSection(id, title){
    title = title.trim();
    var sec = state.sections.find(function(s){ return s.id === id; });
    if(sec && title) sec.title = title;
    persist();
  }
  function deleteSection(id){
    var listIds = state.lists.filter(function(l){ return l.sectionId === id; }).map(function(l){ return l.id; });
    state.tasks = state.tasks.filter(function(t){ return listIds.indexOf(t.listId) === -1; });
    state.lists = state.lists.filter(function(l){ return l.sectionId !== id; });
    state.sections = state.sections.filter(function(s){ return s.id !== id; });
    state.view.selectedListIds = state.view.selectedListIds.filter(function(id2){ return listIds.indexOf(id2) === -1; });
    persist();
  }
  function addList(sectionId, title){
    title = title.trim();
    if(!title) return;
    var list = {id:uid('list'), sectionId:sectionId, title:title};
    state.lists.push(list);
    persist();
    return list;
  }
  function renameList(id, title){
    title = title.trim();
    var list = state.lists.find(function(l){ return l.id === id; });
    if(list && title) list.title = title;
    persist();
  }
  function deleteList(id){
    state.tasks = state.tasks.filter(function(t){ return t.listId !== id; });
    state.lists = state.lists.filter(function(l){ return l.id !== id; });
    state.view.selectedListIds = state.view.selectedListIds.filter(function(x){ return x !== id; });
    persist();
  }
  function toggleListSelected(id){
    state.view.mode = 'lists';
    var idx = state.view.selectedListIds.indexOf(id);
    if(idx > -1){ state.view.selectedListIds.splice(idx,1); }
    else { state.view.selectedListIds.push(id); }
    persist();
  }
  function moveListToSection(listId, targetSectionId){
    var list = state.lists.find(function(l){ return l.id === listId; });
    if(!list) return;
    list.sectionId = targetSectionId;
    persist();
  }
  function deleteCurrentSectionAction(){
    var sec = currentSection();
    if(!sec) return;
    var idx = getSectionIndex(sec.id);
    deleteSection(sec.id);
    if(state.sections.length > 0){
      var newIdx = Math.min(idx, state.sections.length - 1);
      state.view.currentSectionId = state.sections[newIdx].id;
    } else {
      state.view.currentSectionId = null;
    }
    persist();
  }

  /* ================= MUTATIONS: tasks ================= */
  function flipCaptureTaskRects(){
    var rects = {};
    document.querySelectorAll('.task-card').forEach(function(el){
      rects[el.getAttribute('data-task-id')] = el.getBoundingClientRect();
    });
    return rects;
  }
  function flipPlay(beforeRects){
    document.querySelectorAll('.task-card').forEach(function(el){
      var id = el.getAttribute('data-task-id');
      var before = beforeRects[id];
      if(!before){
        el.classList.add('entering');
        setTimeout(function(){ el.classList.remove('entering'); }, DUR_BASE);
        return;
      }
      var after = el.getBoundingClientRect();
      var dx = before.left - after.left;
      var dy = before.top - after.top;
      if(Math.abs(dx) < 1 && Math.abs(dy) < 1) return;
      el.style.transition = 'none';
      el.style.transform = 'translate(' + dx + 'px,' + dy + 'px)';
      requestAnimationFrame(function(){
        el.style.transition = 'transform var(--dur-base) var(--ease-out)';
        el.style.transform = '';
        setTimeout(function(){ el.style.transition = ''; }, DUR_BASE + 30);
      });
    });
  }
  function pulseEl(selector){
    var el = document.querySelector(selector);
    if(!el) return;
    el.classList.remove('pulse');
    void el.offsetWidth;
    el.classList.add('pulse');
    setTimeout(function(){ el.classList.remove('pulse'); }, DUR_BASE + 20);
  }
  function autoResizeTextarea(el){
    if(!el || typeof el.scrollHeight !== 'number') return;
    var maxH = 260;
    el.style.height = 'auto';
    if(el.scrollHeight > maxH){
      el.style.height = maxH + 'px';
      el.style.overflowY = 'auto';
    } else {
      el.style.height = el.scrollHeight + 'px';
      el.style.overflowY = 'hidden';
    }
  }

  var toastTimer = null;
  function showToast(message, actionLabel, actionFn, duration){
    duration = duration || 4000;
    var root = document.getElementById('toast-root');
    if(!root) return;
    clearTimeout(toastTimer);
    var html = '<div class="toast" id="active-toast"><span class="toast-msg">' + escapeHtml(message) + '</span>';
    if(actionLabel){ html += '<button type="button" class="toast-action" id="toast-action-btn">' + escapeHtml(actionLabel) + '</button>'; }
    html += '<button type="button" class="toast-close" id="toast-close-btn" aria-label="Cerrar">' + ICON.x + '</button></div>';
    root.innerHTML = html;
    if(actionLabel && actionFn){
      document.getElementById('toast-action-btn').addEventListener('click', function(){
        actionFn();
        dismissToast();
      });
    }
    document.getElementById('toast-close-btn').addEventListener('click', function(){ dismissToast(); });
    toastTimer = setTimeout(dismissToast, duration);
  }
  function dismissToast(){
    clearTimeout(toastTimer);
    var el = document.getElementById('active-toast');
    if(!el) return;
    el.classList.add('closing');
    setTimeout(function(){
      var root = document.getElementById('toast-root');
      if(root) root.innerHTML = '';
    }, DUR_FAST);
  }

  function addTask(listId, title, notes){
    title = title.trim();
    if(!title) return;
    var task = {id:uid('t'), listId:listId, title:title, notes:(notes||'').trim(), dueDate:null, color:null, starred:false, status:'not_started', subtasks:[]};
    var before = flipCaptureTaskRects();
    state.tasks.push(task);
    persist();
    ui.addingToListId = listId;
    render();
    requestAnimationFrame(function(){ flipPlay(before); });
    var ta = document.querySelector('[data-new-task-input="' + listId + '"]');
    if(ta) ta.focus();
  }
  function deleteTask(taskId){
    state.tasks = state.tasks.filter(function(t){ return t.id !== taskId; });
    persist();
  }
  function animateAndDeleteTask(taskId, afterFn){
    var idx = state.tasks.findIndex(function(t){ return t.id === taskId; });
    if(idx === -1) return;
    var removedTask = state.tasks[idx];
    var el = document.querySelector('.task-card[data-task-id="' + taskId + '"]');

    function finish(){
      var before = flipCaptureTaskRects();
      deleteTask(taskId);
      render();
      requestAnimationFrame(function(){ flipPlay(before); });
      if(afterFn) afterFn();
      showToast('Tarea eliminada', 'Deshacer', function(){
        var before2 = flipCaptureTaskRects();
        state.tasks.splice(Math.min(idx, state.tasks.length), 0, removedTask);
        persist();
        render();
        requestAnimationFrame(function(){ flipPlay(before2); });
      }, 5000);
    }
    if(!el){ finish(); return; }
    el.classList.add('leaving');
    setTimeout(finish, DUR_FAST);
  }
  function setTaskStatus(taskId, status){
    var t = state.tasks.find(function(x){ return x.id === taskId; });
    if(!t) return;
    var reachedCompleted = status === 'completed' && t.status !== 'completed';
    var before = flipCaptureTaskRects();
    t.status = status;
    if(status === 'completed'){ ui.expandedCompletedListIds[t.listId] = true; }
    persist(); render();
    requestAnimationFrame(function(){
      flipPlay(before);
      pulseEl('.status-dot[data-cycle-status="' + taskId + '"]');
      if(reachedCompleted){
        var card = document.querySelector('.task-card[data-task-id="' + taskId + '"]');

  function toggleSubtaskComplete(taskId, subId){

  function moveTaskWithinColumn(taskId, direction){
    var t = state.tasks.find(function(x){ return x.id === taskId; });
    if(!t) return;
    var siblings = state.tasks.filter(function(x){ return x.listId === t.listId; });
    var idx = siblings.indexOf(t);
    var swapIdx = direction === 'up' ? idx - 1 : idx + 1;
    if(swapIdx < 0 || swapIdx >= siblings.length) return;
    var swapWith = siblings[swapIdx];
    var globalIdxA = state.tasks.indexOf(t);
    var globalIdxB = state.tasks.indexOf(swapWith);
    var before = flipCaptureTaskRects();
    state.tasks[globalIdxA] = swapWith;
    state.tasks[globalIdxB] = t;
    persist();
    render();
    requestAnimationFrame(function(){ flipPlay(before); });
    focusTaskById(taskId);
  }

  /* ================= Drag and drop ================= */
  var dragPayload = null;

  var placeholderEl = null;
  function ensurePlaceholder(listEl, afterEl){
    if(!placeholderEl){
      placeholderEl = document.createElement('div');
      placeholderEl.className = 'drop-placeholder';
    }
    if(afterEl){
      if(placeholderEl.nextSibling !== afterEl || placeholderEl.parentNode !== listEl){
        listEl.insertBefore(placeholderEl, afterEl);
      }
    } else if(placeholderEl.parentNode !== listEl || listEl.lastElementChild !== placeholderEl){
      listEl.appendChild(placeholderEl);
    }
  }
  function removePlaceholder(){
    if(placeholderEl && placeholderEl.parentNode){ placeholderEl.parentNode.removeChild(placeholderEl); }
  }

  function setCustomDragImage(e, card){
    if(!e.dataTransfer || typeof e.dataTransfer.setDragImage !== 'function') return;
    try{
      var rect = card.getBoundingClientRect();
      var clone = card.cloneNode(true);
      clone.style.position = 'fixed';
      clone.style.top = '-9999px';
      clone.style.left = '-9999px';
      clone.style.width = rect.width + 'px';
      clone.style.margin = '0';
      clone.style.boxShadow = 'var(--shadow-drag)';
      clone.style.transform = 'rotate(2deg)';
      clone.style.opacity = '.96';
      clone.style.pointerEvents = 'none';
      clone.classList.remove('card-dragging');
      document.body.appendChild(clone);
      var offsetX = e.clientX - rect.left;
      var offsetY = e.clientY - rect.top;
      e.dataTransfer.setDragImage(clone, offsetX, offsetY);
      setTimeout(function(){ if(clone.parentNode) clone.parentNode.removeChild(clone); }, 0);
    }catch(err){ /* custom drag image is a nice-to-have, never block the drag over it */ }
  }

  function onDragStart(e){
    var secRow = e.target.closest('[data-sec-drag]');
    if(secRow){
      dragPayload = {type:'section', id: secRow.getAttribute('data-sec-drag')};
      requestAnimationFrame(function(){ secRow.classList.add('row-dragging'); });
      if(e.dataTransfer) e.dataTransfer.effectAllowed = 'move';
      return;
    }
    var listRow = e.target.closest('[data-list-drag]');
    if(listRow){
      dragPayload = {type:'list', id: listRow.getAttribute('data-list-drag')};
      requestAnimationFrame(function(){ listRow.classList.add('row-dragging'); });
      if(e.dataTransfer) e.dataTransfer.effectAllowed = 'move';
      return;
    }
    var card = e.target.closest('.task-card');
    if(card){
      dragPayload = {type:'task', id: card.getAttribute('data-task-id')};
      requestAnimationFrame(function(){ card.classList.add('card-dragging'); });
      if(e.dataTransfer) e.dataTransfer.effectAllowed = 'move';
      setCustomDragImage(e, card);
    }
  }

  function onDragOver(e){
    if(!dragPayload) return;
    e.preventDefault();
    if(dragPayload.type === 'task'){
      var list = e.target.closest('.task-list');
      document.querySelectorAll('.task-list.list-drag-over').forEach(function(el){
        if(el !== list) el.classList.remove('list-drag-over');
      });
      if(list){
        list.classList.add('list-drag-over');
        var draggingCard = list.querySelector('.card-dragging');
        var afterEl = getDragAfterElementY(list, e.clientY, '.task-card', draggingCard);
        ensurePlaceholder(list, afterEl);
      } else {
        removePlaceholder();
      }
    }
  }

  function onDrop(e){
    if(!dragPayload) return;
    e.preventDefault();
    removePlaceholder();

    if(dragPayload.type === 'task'){
      var listEl = e.target.closest('.task-list');
      if(listEl){
        var listId = listEl.getAttribute('data-list-tasks');
        var task = state.tasks.find(function(t){ return t.id === dragPayload.id; });
        if(task && listId){
          var afterEl = getDragAfterElementY(listEl, e.clientY, '.task-card', listEl.querySelector('.card-dragging'));
          var afterId = afterEl ? afterEl.getAttribute('data-task-id') : null;
          var before = flipCaptureTaskRects();
          state.tasks = state.tasks.filter(function(t){ return t.id !== task.id; });
          insertInto(state.tasks, task, 'listId', listId, afterId);
          persist();
          dragPayload = null;
          render();
          requestAnimationFrame(function(){ flipPlay(before); });
          return;
        }
      }
    } else if(dragPayload.type === 'list'){
      var bodyEl = e.target.closest('#section-pager-body');
      var sec = currentSection();
      if(bodyEl && sec){
        var list = state.lists.find(function(l){ return l.id === dragPayload.id; });
        if(list){
          var afterElL = getDragAfterElementY(bodyEl, e.clientY, '.list-row', bodyEl.querySelector('.row-dragging'));
          var afterIdL = afterElL ? afterElL.getAttribute('data-list-id') : null;
          state.lists = state.lists.filter(function(l){ return l.id !== list.id; });
          insertInto(state.lists, list, 'sectionId', sec.id, afterIdL);
          persist();
        }
      }
    } else if(dragPayload.type === 'section'){
      var dd = document.getElementById('all-sections-dropdown');
      var sec2 = state.sections.find(function(s){ return s.id === dragPayload.id; });
      if(sec2 && dd){
        var afterElS = getDragAfterElementY(dd, e.clientY, '.section-menu-item-row', dd.querySelector('.row-dragging'));
        var afterIdS = afterElS ? afterElS.getAttribute('data-sec-id') : null;
        state.sections = state.sections.filter(function(s){ return s.id !== sec2.id; });
        if(afterIdS){
          var idx = state.sections.findIndex(function(s){ return s.id === afterIdS; });
          state.sections.splice(idx, 0, sec2);
        } else {
          state.sections.push(sec2);
        }
        persist();
      }
    }

    dragPayload = null;
    render();
  }

  function onDragEnd(){
    dragPayload = null;
    removePlaceholder();
    document.querySelectorAll('.card-dragging').forEach(function(el){ el.classList.remove('card-dragging'); });
    document.querySelectorAll('.row-dragging').forEach(function(el){ el.classList.remove('row-dragging'); });
    document.querySelectorAll('.list-drag-over').forEach(function(el){ el.classList.remove('list-drag-over'); });
  }

    document.querySelectorAll('[data-subtask-draft-title]').forEach(function(inp){

  function sanitizeView(view, lists, sections){
    view = (view && typeof view === 'object') ? view : {};
    var mode = (view.mode === 'all' || view.mode === 'starred' || view.mode === 'lists') ? view.mode : 'lists';
    var selectedListIds = Array.isArray(view.selectedListIds) ? view.selectedListIds.filter(function(id){
      return lists.some(function(l){ return l.id === id; });
    }) : [];
    var currentSectionId = (view.currentSectionId && sections.some(function(s){ return s.id === view.currentSectionId; }))
      ? view.currentSectionId
      : (sections[0] ? sections[0].id : null);
    return { mode:mode, selectedListIds:selectedListIds, sidebarCollapsed:!!view.sidebarCollapsed, currentSectionId:currentSectionId };
  }

  function validateImportedData(parsed){
    var data = (parsed && parsed.data && Array.isArray(parsed.data.sections)) ? parsed.data : parsed;
    if(!data || !Array.isArray(data.sections) || !Array.isArray(data.lists) || !Array.isArray(data.tasks)) return null;

    var sections = data.sections.filter(function(s){ return s && typeof s.id === 'string' && typeof s.title === 'string'; });
    var lists = data.lists.filter(function(l){ return l && typeof l.id === 'string' && typeof l.sectionId === 'string' && typeof l.title === 'string'; });
    var tasks = data.tasks.filter(function(t){ return t && typeof t.id === 'string' && typeof t.listId === 'string' && typeof t.title === 'string'; });

    migrateTasksStatus(tasks);
    tasks.forEach(function(t){
      if(!Array.isArray(t.subtasks)) t.subtasks = [];
      t.subtasks = t.subtasks.filter(function(s){ return s && typeof s.id === 'string' && typeof s.title === 'string'; });
      if(typeof t.notes !== 'string') t.notes = '';
      if(typeof t.starred !== 'boolean') t.starred = false;
      if(typeof t.dueDate === 'undefined') t.dueDate = null;
      if(typeof t.color === 'undefined') t.color = null;
    });

    var theme = (data.theme === 'light' || data.theme === 'dark' || data.theme === 'auto') ? data.theme : 'dark';
    return { theme:theme, sections:sections, lists:lists, tasks:tasks, view: sanitizeView(data.view, lists, sections) };
  }

  function exportData(){
    var payload = {
      app:'taskboard', version:1, exportedAt:new Date().toISOString(),
      data:{ theme:state.theme, view:state.view, sections:state.sections, lists:state.lists, tasks:state.tasks }
    };
    var json = JSON.stringify(payload, null, 2);
    try{
      var blob = new Blob([json], {type:'application/json'});
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = 'taskboard-backup-' + todayISO() + '.json';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
      ui.exportFeedback = 'ok';
    }catch(err){
      console.error('No se pudo exportar', err);
      ui.exportFeedback = 'error';
    }
    render();
    setTimeout(function(){ ui.exportFeedback = null; render(); }, 2500);
  }

  function handleImportFile(file){
    var reader = new FileReader();
    reader.onload = function(){
      try{
        var parsed = JSON.parse(String(reader.result));
        var validated = validateImportedData(parsed);
        if(!validated){
          ui.importError = 'El archivo no tiene un formato válido de backup de Taskboard.';
          ui.pendingImportData = null;
        } else {
          ui.importError = null;
          ui.pendingImportData = validated;
        }
      }catch(err){
        ui.importError = 'No se pudo leer el archivo. ¿Es un JSON válido?';
        ui.pendingImportData = null;
      }
      render();
    };
    reader.onerror = function(){
      ui.importError = 'No se pudo leer el archivo.';
      ui.pendingImportData = null;
      render();
    };
    reader.readAsText(file);
  }

  /* ================= Keyboard-first navigation ================= */
  function isFormField(el){
    if(!el) return false;
    var tag = el.tagName;
    return tag === 'INPUT' || tag === 'TEXTAREA' || !!el.isContentEditable;
  }
  function focusTaskById(id){
    var el = document.querySelector('.task-card[data-task-id="' + id + '"]');
    if(el) el.focus();
    return el;
  }
  function getVisibleColumnEls(){
    return Array.prototype.slice.call(boardEl.querySelectorAll('.column'));
  }
  function getTaskCardEls(colEl){
    return Array.prototype.slice.call(colEl.querySelectorAll('.task-card'));
  }
  function focusColumnFallback(colEl){
    if(!colEl) return;
    var addBtn = colEl.querySelector('.add-task-btn');
    if(addBtn){ addBtn.focus(); return; }
    var ta = colEl.querySelector('[data-new-task-input]');
    if(ta){ ta.focus(); }
  }

  function moveTaskFocus(currentEl, direction){
    var colEl = currentEl.closest('.column');
    if(!colEl) return;
    var cards = getTaskCardEls(colEl);
    var curIdx = cards.indexOf(currentEl);

    if(direction === 'down'){
      if(cards[curIdx+1]){ cards[curIdx+1].focus(); }
      else { focusColumnFallback(colEl); }
      return;
    }
    if(direction === 'up'){
      if(cards[curIdx-1]){ cards[curIdx-1].focus(); }
      return;
    }
    var cols = getVisibleColumnEls();
    var colIdx = cols.indexOf(colEl);
    var targetCol = cols[direction === 'left' ? colIdx - 1 : colIdx + 1];
    if(!targetCol) return;
    var targetCards = getTaskCardEls(targetCol);
    if(targetCards.length === 0){ focusColumnFallback(targetCol); return; }
    var targetIdx = Math.min(Math.max(curIdx, 0), targetCards.length - 1);
    targetCards[targetIdx].focus();
  }

  function moveFromAddButton(btnEl, direction){
    var colEl = btnEl.closest('.column');
    if(!colEl) return;
    if(direction === 'up'){
      var cards = getTaskCardEls(colEl);
      if(cards.length){ cards[cards.length-1].focus(); }
      return;
    }
    var cols = getVisibleColumnEls();
    var colIdx = cols.indexOf(colEl);
    var targetCol = cols[direction === 'left' ? colIdx - 1 : colIdx + 1];
    if(!targetCol) return;
    var targetCards = getTaskCardEls(targetCol);
    if(targetCards.length){ targetCards[targetCards.length-1].focus(); }
    else { focusColumnFallback(targetCol); }
  }

  function cancelPendingDelete(){
    clearTimeout(pendingDeleteTimer);
    pendingDeleteTimer = null;
    ui.pendingDeleteTaskId = null;
  }

  function requestDeleteFocused(taskCardEl){
    var taskId = taskCardEl.getAttribute('data-task-id');
    if(ui.pendingDeleteTaskId === taskId){
      var colEl = taskCardEl.closest('.column');
      var listId = colEl ? colEl.getAttribute('data-col-list') : null;
      var cards = colEl ? getTaskCardEls(colEl) : [];
      var idx = cards.indexOf(taskCardEl);
      var nextId = null;
      if(cards[idx+1]) nextId = cards[idx+1].getAttribute('data-task-id');
      else if(cards[idx-1]) nextId = cards[idx-1].getAttribute('data-task-id');
      cancelPendingDelete();
      animateAndDeleteTask(taskId, function(){
        if(nextId){ focusTaskById(nextId); }
        else if(listId){
          var addBtn = document.querySelector('[data-add-task="' + listId + '"]');
          if(addBtn) addBtn.focus();
        }
      });
    } else {
      cancelPendingDelete();
      ui.pendingDeleteTaskId = taskId;
      render();
      focusTaskById(taskId);
      pendingDeleteTimer = setTimeout(function(){
        ui.pendingDeleteTaskId = null;
        var focused = document.activeElement;
        var keepId = (focused && focused.classList && focused.classList.contains('task-card')) ? focused.getAttribute('data-task-id') : null;
        render();
        if(keepId) focusTaskById(keepId);
      }, 3000);
    }
  }

  function handleGlobalShortcut(e){
    switch(e.key){
      case '/':
        e.preventDefault();
        var si = document.getElementById('search-input');
        if(si) si.focus();
        return true;
      case 'n': case 'N':
        quickAddTask();
        return true;
      case 'm': case 'M':
        state.view.sidebarCollapsed = !state.view.sidebarCollapsed;
        persist(); render();
        return true;
      case '[':
        var pIdx = getSectionIndex(state.view.currentSectionId);
        if(pIdx > 0) goToSection(state.sections[pIdx - 1].id, 'prev');
        return true;
      case ']':
        var nIdx = getSectionIndex(state.view.currentSectionId);
        if(nIdx > -1 && nIdx < state.sections.length - 1) goToSection(state.sections[nIdx + 1].id, 'next');
        return true;
      case 'a': case 'A':
        state.view.mode = 'all'; persist(); render();
        return true;
      case 'f': case 'F':
        state.view.mode = 'starred'; persist(); render();
        return true;
      case '?':
        e.preventDefault();
        openShortcutsHelp();
        return true;
      case 'ArrowDown': case 'ArrowRight':
        e.preventDefault();
        var cols0 = getVisibleColumnEls();
        if(cols0.length){
          var firstCards = getTaskCardEls(cols0[0]);
          if(firstCards.length){ firstCards[0].focus(); }
          else { focusColumnFallback(cols0[0]); }
        }
        return true;
    }
    return false;
  }

  document.addEventListener('keydown', function(e){
    var ae = document.activeElement;

    if(ui.editingTaskId && e.key === 'Enter' && (e.metaKey || e.ctrlKey)){
      e.preventDefault(); saveModal(); return;
    }

    if(e.key === 'Escape'){
      if(ui.notesFullscreenOpen){ closeNotesFullscreen(); return; }
      if(ui.editingTaskId){ closeModal(); return; }
      if(ui.settingsOpen){ closeSettings(); return; }
      if(ui.editingCurrentSectionTitle){ ui.editingCurrentSectionTitle=false; render(); return; }
      if(ui.allSectionsMenuOpen){ ui.allSectionsMenuOpen=false; render(); return; }
      if(ui.currentSectionMenuOpen){ ui.currentSectionMenuOpen=false; ui.confirmDeleteCurrentSection=false; render(); return; }
      if(ui.openListMenuId){ ui.openListMenuId=null; ui.confirmDeleteListId=null; ui.movingListId=null; render(); return; }
      if(ui.createMenuOpen){ ui.createMenuOpen=false; render(); return; }
      if(ui.addingToListId){ ui.addingToListId=null; render(); return; }
      if(ui.addingSection){ ui.addingSection=false; render(); return; }
      if(ui.addingListToSectionId){ ui.addingListToSectionId=null; render(); return; }
      if(ui.pendingDeleteTaskId){ cancelPendingDelete(); render(); return; }
      if(ae && ae.classList && ae.classList.contains('task-card')){ ae.blur(); return; }
      return;
    }

    if(isFormField(ae)) return;

    var anyMenuOpen = ui.createMenuOpen || ui.allSectionsMenuOpen || ui.currentSectionMenuOpen || ui.openListMenuId || ui.movingListId;
    if(ui.editingTaskId || ui.settingsOpen || anyMenuOpen) return;

    var onTaskCard = ae && ae.classList && ae.classList.contains('task-card');
    var onAddBtn = ae && ae.classList && ae.classList.contains('add-task-btn');

    if(onTaskCard){
      var taskId = ae.getAttribute('data-task-id');
      if(ui.pendingDeleteTaskId && ui.pendingDeleteTaskId !== taskId){ cancelPendingDelete(); }
      if((e.key === 'ArrowUp' || e.key === 'ArrowDown') && (e.metaKey || e.ctrlKey) && e.shiftKey){
        e.preventDefault();
        moveTaskWithinColumn(taskId, e.key === 'ArrowUp' ? 'up' : 'down');
        return;
      }
      if(e.key === 'ArrowDown'){ e.preventDefault(); moveTaskFocus(ae, 'down'); return; }
      if(e.key === 'ArrowUp'){ e.preventDefault(); moveTaskFocus(ae, 'up'); return; }
      if(e.key === 'ArrowRight'){ e.preventDefault(); moveTaskFocus(ae, 'right'); return; }
      if(e.key === 'ArrowLeft'){ e.preventDefault(); moveTaskFocus(ae, 'left'); return; }
      if(e.key === 'Enter' || e.key === 'e' || e.key === 'E'){ openTaskModal(taskId); return; }
      if(e.key === ' '){ e.preventDefault(); cycleTaskStatus(taskId); focusTaskById(taskId); return; }
      if(e.key === '1'){ setTaskStatus(taskId, 'not_started'); focusTaskById(taskId); return; }
      if(e.key === '2'){ setTaskStatus(taskId, 'in_progress'); focusTaskById(taskId); return; }
      if(e.key === '3'){ setTaskStatus(taskId, 'completed'); focusTaskById(taskId); return; }
      if(e.key === 'f' || e.key === 'F'){ toggleTaskStarred(taskId); focusTaskById(taskId); return; }
      if(e.key === 'Delete' || e.key === 'Backspace'){ e.preventDefault(); requestDeleteFocused(ae); return; }
      if(handleGlobalShortcut(e)) return;
      return;
    }

    if(onAddBtn){
      if(e.key === 'ArrowUp'){ e.preventDefault(); moveFromAddButton(ae, 'up'); return; }
      if(e.key === 'ArrowLeft'){ e.preventDefault(); moveFromAddButton(ae, 'left'); return; }
      if(e.key === 'ArrowRight'){ e.preventDefault(); moveFromAddButton(ae, 'right'); return; }
      if(handleGlobalShortcut(e)) return;
      return;
    }

    handleGlobalShortcut(e);
  });

  /* ================= Global listeners ================= */
  sidebarInner.addEventListener('click', onSidebarClick);
  sidebarInner.addEventListener('dragstart', onDragStart);
  sidebarInner.addEventListener('dragover', onDragOver);
  sidebarInner.addEventListener('drop', onDrop);
  sidebarInner.addEventListener('dragend', onDragEnd);

  boardEl.addEventListener('click', onBoardClick);
  boardEl.addEventListener('dragstart', onDragStart);
  boardEl.addEventListener('dragover', onDragOver);
  boardEl.addEventListener('drop', onDrop);
  boardEl.addEventListener('dragend', onDragEnd);

  document.getElementById('hamburger-btn').addEventListener('click', function(){
    state.view.sidebarCollapsed = !state.view.sidebarCollapsed;
    persist(); render();
  });
  sidebarBackdrop.addEventListener('click', function(){
    state.view.sidebarCollapsed = true; persist(); render();
  });
  document.getElementById('search-input').addEventListener('input', function(e){
    ui.searchQuery = e.target.value; renderBoard();
  });

  document.addEventListener('click', function(e){
    if(ui.allSectionsMenuOpen && !e.target.closest('.pager-title-wrap')){ ui.allSectionsMenuOpen=false; render(); }
    else if(ui.currentSectionMenuOpen && !e.target.closest('.current-section-menu-btn')){ ui.currentSectionMenuOpen=false; ui.confirmDeleteCurrentSection=false; render(); }
    else if(ui.openListMenuId && !e.target.closest('.list-menu-wrap')){ ui.openListMenuId=null; ui.confirmDeleteListId=null; ui.movingListId=null; render(); }
    else if(ui.createMenuOpen && !e.target.closest('#create-btn')){ ui.createMenuOpen=false; render(); }
  });

  /* ================= Init ================= */
  loadState().then(function(){
    applyTheme();
    render();
  });
})();
</script>
</body>
</html>
